# This is a basic workflow to help you get started with Actions

name: Release

on:
  push:
    tags: [ "v*.*.*" ]


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Placeholder for master branch
        run: |
          echo "This job is a placeholder to ensure CI passes on master branch pushes and PRs. No image is built."


  release:
    strategy:
      matrix:
        os: [ windows-latest ]
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name LogSenderGUI main.py

      - name: Release App
        uses: ncipollo/release-action@v1
        with:
          draft: false
          allowUpdates: true
          artifacts: |
            dist/LogSenderGUI.exe
